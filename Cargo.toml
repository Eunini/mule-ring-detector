[workspace]
resolver = "2"
members = ["crates/mrd-core", "crates/mrd-eval", "crates/mrd-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Inioluwa Atanda"]
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
rustc-hash = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1
