# Default runtime configuration: PostgreSQL.
# Every credential is supplied through environment variables; there are no defaults here.
server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: case-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mrd}
    username: ${SPRING_DATASOURCE_USERNAME:mrd}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mrd:
  security:
    bcrypt-strength: 10
    users:
      - username: analyst1
        password: ${MRD_ANALYST1_PASSWORD}
        full-name: Alex Analyst
        email: analyst1@example.org
        roles: [ANALYST]
      - username: analyst2
        password: ${MRD_ANALYST2_PASSWORD}
        full-name: Blair Analyst
        email: analyst2@example.org
        roles: [ANALYST]
      - username: supervisor1
        password: ${MRD_SUPERVISOR1_PASSWORD}
        full-name: Casey Supervisor
        email: supervisor1@example.org
        roles: [SUPERVISOR]
      - username: engine
        password: ${MRD_ENGINE_PASSWORD}
        full-name: Detection Engine
        roles: [INGEST]
  str:
    rentity-id: ${MRD_STR_RENTITY_ID:DEMO-FIU-0001}
    institution-name: ${MRD_STR_INSTITUTION_NAME:Example Reporting Bank}
    currency-code-local: USD
    transaction-location: Electronic channel
    location:
      address-type: B
      address: 1 Example Street
      city: Example City
      country-code: XX
